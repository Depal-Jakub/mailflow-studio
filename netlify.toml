[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev"
  targetPort = 4173
  port = 8888
  autoLaunch = false

[functions."connector-worker"]
  schedule = "*/5 * * * *"

[functions."outbound-worker"]
  schedule = "* * * * *"

[functions."pipeline-worker"]
  schedule = "* * * * *"

[functions."scrape-dispatcher"]
  schedule = "*/5 * * * *"

[functions."maintenance-worker"]
  schedule = "15 2 * * *"

[[redirects]]
  from = "/hooks/:source_id"
  to = "/.netlify/functions/source-webhook/:source_id"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/admin-api/:splat"
  status = 200

[[redirects]]
  from = "/v1/*"
  to = "/.netlify/functions/public-api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
